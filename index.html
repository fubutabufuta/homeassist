<!DOCTYPE html>
<html lang="tr" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ev Paneli</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="tabs" aria-label="Bölümler">
  <button data-tab="home" class="active"><span>Ana Sayfa</span></button>
  <button data-tab="cams"><span>Kameralar</span></button>
  <button data-tab="plan"><span>Kat Planı</span></button>
  <button data-tab="robot"><span>Robot</span></button>
  <button data-tab="faces"><span>Yüzler</span></button>
  <button data-tab="all"><span>Tüm Cihazlar</span></button>
</nav>

<div id="shell">
  <header>
    <div id="clock">--:--</div>
    <div class="hd-meta">
      <div id="greet"></div>
      <div id="date"></div>
    </div>
    <div id="chips"></div>
    <div id="camchip" class="chip" hidden><i></i><span>Yüz tanıma açık</span></div>
    <div class="spacer"></div>
    <div id="status" class="badge">Bağlanıyor</div>
  </header>

  <main>
    <section id="tab-home" class="tab active"></section>
    <section id="tab-cams" class="tab"></section>
    <section id="tab-plan" class="tab"></section>
    <section id="tab-robot" class="tab"></section>
    <section id="tab-faces" class="tab"></section>
    <section id="tab-all" class="tab">
      <input id="search" type="search" placeholder="Cihaz adı ya da entity_id ile ara">
      <div id="filters"></div>
      <div id="all-list"></div>
    </section>
  </main>
</div>

<div id="toast" role="status"></div>
<script src="config.js"></script>
<script src="ha.js"></script>
<script src="app.js"></script>
<script src="faces.js"></script>
</body>
</html>
